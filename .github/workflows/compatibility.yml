name: Compatibility

on:
  schedule:
    # Monday at 03:23 UTC.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      # This isolated matrix job verifies the declared floors without changing PR dependencies.
      - name: Check declared SDK and Pydantic minimums
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: python -m pip install "mcp==2.2.0" "pydantic==2.12.0" && python -m pip check
      - name: Run all non-real-NX tests
        run: python -m pytest -p no:cacheprovider -m "not real_nx"
