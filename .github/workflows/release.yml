name: Build offline NX release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: nx-mcp-windows-offline
          path: dist/*
