name: Update Star History

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/star-history.yml"
  watch:
    types: [started]
  schedule:
    # Daily at 04:37 UTC (12:37 Asia/Shanghai); reconciles missed events and unstars.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history-publish
  cancel-in-progress: false

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Create chart output directory
        run: mkdir -p assets
      - name: Generate star history
        uses: xpzouying/star-history@v1
        with:
          branch: star-history
          commit-message: "chore: update star history chart"
